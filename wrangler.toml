# Cloudflare Pages & Workers Configuration
name = "solaris-reef-hub"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

#[build.environment]
#BUN_VERSION = "1.2.4"
#NODE_VERSION = "20.18.0"

[vars]
BILLPLZ_SANDBOX = "false"
# Note: Production secrets (ADMIN_EMAIL, ADMIN_PASSWORD, SESSION_SECRET,
# BILLPLZ_API_KEY, BILLPLZ_COLLECTION_ID, BILLPLZ_X_SIGNATURE_KEY) must be
# set securely as Cloudflare Pages secrets (via Dashboard or wrangler secret put)
# and never committed in plaintext.

# Cloudflare D1 Database Binding
# Create production database: wrangler d1 create solaris-reef-db
# Initialize schema: wrangler d1 execute solaris-reef-db --file=./schema.sql
# For local D1 dev: wrangler pages dev dist --d1=DB=solaris-reef-db
[[d1_databases]]
binding = "DB"
database_name = "solaris-reef-db"
database_id = "949758ab-a77b-4ddb-8dea-e0f4c70d4607"

# Cloudflare R2 Media Storage Binding (admin photos, documents, certificates)
# Create bucket: wrangler r2 bucket create solaris-reef-media
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "solaris-reef-media"

# Optional Cloudflare KV Namespace (session/cache storage)
# [[kv_namespaces]]
# binding = "KV"
# id = "solaris-reef-kv"
