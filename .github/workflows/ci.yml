name: Solaris Reef CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Bun (supports lockfileVersion: 2)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck / Lint
        run: bun run lint

      - name: Build Production Client
        run: bun run build
